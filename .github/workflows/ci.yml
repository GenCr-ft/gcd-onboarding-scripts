name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

# Restrict GITHUB_TOKEN to read-only. Self-hosted runner risk is low: private
# org repo — only org members with write access can open PRs.
permissions:
  contents: read

concurrency:
  # One in-flight run per workflow per ref. Superseded pushes are cancelled on branches;
  # main is never cancelled, so a run that uploads artefacts always completes (pm#546).
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  unit-tests:
    name: Shell Unit Tests
    runs-on: [self-hosted, linux, x64]
    timeout-minutes: 20
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run full test suite
        run: bash test.sh
        timeout-minutes: 10

  shellcheck:
    name: ShellCheck Lint
    runs-on: [self-hosted, linux, x64]
    timeout-minutes: 10
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run shellcheck on all shell scripts
        run: find . -name "*.sh" -not -path "./.git/*" | xargs -r shellcheck --severity=error
